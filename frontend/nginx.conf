server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (SaaS compose) or the same host
    # (on-prem single-container style). Override with env at runtime if needed.
    location ~ ^/(upload|status|retrieve|hitl|documents|usage|auth|audit) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}