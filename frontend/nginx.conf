# Security headers shared by the UI (console) reverse proxy.
# TLS is terminated upstream (load balancer / Render / Cloudflare). We
# redirect HTTP->HTTPS when a terminating proxy tells us the original
# request was plain HTTP, and otherwise serve directly (local/dev).

# Content Security Policy — this console is a same-origin SPA that also
# renders PDF previews in a blob:<origin> iframe, hence frame-src blob:.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # --- HTTPS redirect (only when a TLS-terminating proxy explicitly reports
    # that the original request was plain HTTP). When the header is absent
    # (direct local access) we serve on the incoming scheme and never break
    # local previews. The proxy MUST overwrite X-Forwarded-Proto in prod. ---
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # --- Response headers for the API (forward upstream's responses) ---
    # CORS is set by the API itself; here we only pass through.

    # Proxy API calls to the backend service (SaaS compose) or the same host
    # (on-prem single-container style). Override with env at runtime if needed.
    location ~ ^/(upload|status|retrieve|hitl|documents|usage|auth|audit) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
