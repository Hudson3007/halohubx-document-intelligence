name: Build & boot smoke test

# Proves the whole Docker Compose stack actually builds and boots, and that
# the end-to-end loop works inside containers. This is the Phase-0 gate for
# "does it really run", plus a regression guard for the Phase-2 accuracy and
# Phase-3 billing work.
#
# NOTE: office-ai pulls torch/sentence-transformers (~2GB) and builds slowly,
# so builds on GitHub-hosted runners naturally take a long while. Watch the
# job timeout (default 360 min) if this grows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_PASSWORD: ci_test_password
      DEFAULT_AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # optional; smoke test needs providers OR a stub
      HALOHUBX_PARTNER_API_KEY: "ci_partner_key"
      # Turn on the dev-simulate billing endpoint for the Phase 3b billing smoke
      # (compose defaults it to off for production safety). No merchant key needed.
      ENABLE_DEV_PAYMENTS: "true"
      CREDIT_PRICE_PAISE: "200"

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config --quiet && echo "compose config valid"

      - name: Validate YAML + Python syntax (fast, before slow builds)
        run: |
          python - <<'EOF'
          import yaml
          yaml.safe_load(open('docker-compose.yml'))
          print('compose YAML OK')
          EOF

      - name: Build images (db/api/ui/site/office-ai; sync-agent in its profile)
        run: |
          docker compose build api ui site
          docker compose --profile onprem build sync-agent
        # office-ai is built below in its own step so a failure is isolated.

      - name: Build office-ai image (heavy deps — isolated)
        run: docker compose build office-ai

      # Boot the SaaS core first (db/api/ui/site) — no provider key needed to
      # prove the containers come up; the smoke upload only needs the pipeline.
      - name: Boot core stack
        run: |
          docker compose up -d db api ui site
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/ >/dev/null; then echo "api up"; break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/ | grep '"status":"ok"'

      # The nginx configs carry the security headers (CSP, HSTS-ready, etc.).
      # Verifying they actually boot and respond proves a misconfig breaks CI.
      - name: Verify nginx security headers (ui + site)
        run: |
          set -eux
          # ui (console) serves the SPA and must expose the CSP + nosniff.
          HDR=$(curl -sI http://localhost:8080/ --max-time 20)
          echo "$HDR" | grep -i 'HTTP/1.1 200' || true
          echo "$HDR" | grep -iq 'content-security-policy' && echo "ui CSP present"
          echo "$HDR" | grep -iq 'x-content-type-options: nosniff' && echo "ui nosniff present"
          # site (marketing) serves the landing page with its own CSP.
          SHDR=$(curl -sI http://localhost:8081/ --max-time 20)
          echo "$SHDR" | grep -iq 'content-security-policy' && echo "site CSP present"

      # Need an AI provider key to run real extraction. CI currently has none,
      # so this gate runs the benchmark ONLY when a key is configured, and
      # otherwise reports a clear skip. It enforces the field-accuracy floor +
      # minimum-docs (catching broken prompts/empty extraction/provider outage)
      # over the human-labelled synthetic golden set.
      - name: "Accuracy gate (benchmark.py; needs an AI provider key, else skips)"
        run: |
          set -eux
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::accuracy gate skipped: no AI provider key (GEMINI_API_KEY or ANTHROPIC_API_KEY) configured."
            echo "Enable it with:  gh secret set GEMINI_API_KEY"
            exit 0
          fi
          # Reuse the built api image (has app code + all deps); mount the repo
          # read-write so benchmark.py can also refresh site/public/benchmark.json.
          docker compose run --rm --no-deps -v "$PWD:/srv" api \
            python benchmark.py --pdfs benchmark/pdfs --gold benchmark/gold.json \
              --out benchmark/reports/report.html \
              --gate --gate-min-docs 5 --gate-min-acc 80

      - name: "Smoke: signup -> upload -> confirm -> audit (in containers)"
        run: |
          set -eux
          # The api entrypoint seeds a default partner + (if creds set) a user.
          # We read the seeded partner's api_key directly from Postgres via the
          # api service's own DB access to keep this hermetic.
          API_KEY=$(docker compose exec -T api python -c "from app.db import SessionLocal; from app.models import Partner; db=SessionLocal(); print(db.query(Partner).first().api_key); db.close()")
          echo "partner key: ${API_KEY:0:12}..."

          # Self-serve signup also works and returns its own key.
          KEY=$(curl -s http://localhost:8000/auth/signup -H 'Content-Type: application/json' \
                -d "{\"name\":\"CI\",\"email\":\"ci_$(date +%s)@example.com\",\"password\":\"CIPass12345!\"}" \
                | python -c 'import sys,json;print(json.load(sys.stdin)["session_token"])')
          echo "console token: ${KEY:0:12}..."

          # Generate a minimal 1-page PDF inside the api container (has pymupdf) and
          # upload it from the same container via httpx, which keeps the test
          # hermetic (no host copy step).
          DID=$(docker compose exec -T -e CI_KEY="$KEY" api python - <<'EOF'
          import fitz, httpx
          doc = fitz.open(); page = doc.new_page()
          page.insert_text((72,72), "INVOICE vendor Acme GSTIN 29AAAAA0000A1Z5 total 100.00 invoice=INV-1")
          pdf = doc.tobytes()
          r = httpx.post("http://localhost:8000/upload",
                         headers={"Authorization": "Bearer %s" % __import__("os").environ["CI_KEY"]},
                         files={"file": ("ci_smoke.pdf", pdf, "application/pdf")},
                         data={"client_name": "CI Client"})
          print(r.json()["document_id"])
          EOF
          )
          echo "uploaded doc: $DID"
          curl -sf http://localhost:8000/hitl/document/$DID -H "Authorization: Bearer $KEY" >/dev/null
          curl -sf -X POST http://localhost:8000/hitl/document/$DID/confirm \
               -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
               -d '{"result":{"invoice_count":1,"invoices":[]}}' \
               | grep '"status":"completed"'
          curl -sf http://localhost:8000/audit -H "Authorization: Bearer $KEY" | grep '"action":"upload"'

      # --- Phase 3a: tenant-isolation / privilege-escalation regression.
      # Guards the HIGH finding: the partner's machine api_key must NOT be
      # returned at signup/login/invite-accept, it must only be readable by an
      # OWNER via GET /auth/partner, and an analyst must be 403 on owner-only
      # endpoints while still able to do analyst work (usage).
      - name: "Tenant isolation: api_key not leaked; analyst cannot escalate to owner"
        run: |
          set -eux
          BASE=http://localhost:8000
          EMAIL="iso_$(date +%s)@example.com"
          PW='IsolationTest123!'

          # API key must NOT appear in the signup response body (owner signup).
          SIGNUP=$(curl -s "$BASE/auth/signup" -H 'Content-Type: application/json' \
                   -d "{\"name\":\"Iso Owner\",\"email\":\"$EMAIL\",\"password\":\"$PW\"}")
          if echo "$SIGNUP" | grep -q '"api_key"'; then
            echo "FAIL: signup leaked api_key"; exit 1
          fi
          OWN_TOKEN=$(echo "$SIGNUP" | python -c 'import sys,json;print(json.load(sys.stdin)["session_token"])')

          # And must NOT appear in login either.
          LOGIN=$(curl -s "$BASE/auth/login" -H 'Content-Type: application/json' \
                  -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}")
          if echo "$LOGIN" | grep -q '"api_key"'; then
            echo "FAIL: login leaked api_key"; exit 1
          fi

          # Owner CAN read the machine key via the owner-only endpoint.
          OWN_PARTNER=$(curl -s "$BASE/auth/partner" -H "Authorization: Bearer $OWN_TOKEN")
          echo "$OWN_PARTNER" | grep -q '"api_key"' || { echo "FAIL: owner could not read api_key"; exit 1; }

          # Invite an analyst; the invite-accept response must NOT carry api_key.
          INVITE=$(curl -s -X POST "$BASE/auth/partner/members" \
                   -H "Authorization: Bearer $OWN_TOKEN" -H 'Content-Type: application/json' \
                   -d "{\"email\":\"ana_$(date +%s)@example.com\",\"role\":\"analyst\"}")
          INV_TOKEN=$(echo "$INVITE" | python -c 'import sys,json;print(json.load(sys.stdin)["invite_link"].rsplit("/",1)[1])')
          ACCEPT=$(curl -s -X POST "$BASE/auth/invite/$INV_TOKEN/accept" \
                   -H 'Content-Type: application/json' \
                   -d '{"name":"Ana","password":"AnalystPass123!"}')
          if echo "$ACCEPT" | grep -q '"api_key"'; then
            echo "FAIL: invite-accept leaked api_key"; exit 1
          fi
          ANA_TOKEN=$(echo "$ACCEPT" | python -c 'import sys,json;print(json.load(sys.stdin)["session_token"])')

          # Analyst must be FORBIDDEN from owner-only endpoints (partner config,
          # owner signup, partner creation)...
          curl -s -o /dev/null -w "%{http_code}" "$BASE/auth/partner" \
               -H "Authorization: Bearer $ANA_TOKEN" | grep -q 403 \
               || { echo "FAIL: analyst could read /auth/partner"; exit 1; }
          curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/auth/signup" \
               -H "Authorization: Bearer $ANA_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"name\":\"x\",\"email\":\"x_$(date +%s)@example.com\",\"password\":\"CIPass12345!\"}" \
               | grep -q 403 \
               || { echo "FAIL: analyst could sign up a new partner"; exit 1; }

          # ...but MAY do analyst work (read usage, view partner-scoped data).
          curl -sf "$BASE/usage" -H "Authorization: Bearer $ANA_TOKEN" >/dev/null \
               || { echo "FAIL: analyst blocked from usage"; exit 1; }
          echo "tenant-isolation checks passed (no api_key leak; analyst cannot escalate)"

      # --- Phase 3b: Billing smoke. No merchant key in CI, so we exercise the
      # dev-simulate path (ENABLE_DEV_PAYMENTS=1) to prove the credits + plan
      # ledger round-trips: grant credits, switch plan, and confirm the billing
      # snapshot reflects both. Real Razorpay checkout/webhooks are exercised
      # manually after Profezzo supplies merchant keys.
      - name: "Billing: grant credits, switch plan, verify billing snapshot"
        run: |
          set -eux
          BASE=http://localhost:8000
          EMAIL="bill_$(date +%s)@example.com"
          PW='BillCIPass123!'
          SIGNUP=$(curl -s "$BASE/auth/signup" -H 'Content-Type: application/json' \
                   -d "{\"name\":\"CI Billing\",\"email\":\"$EMAIL\",\"password\":\"$PW\"}")
          TOKEN=$(echo "$SIGNUP" | python -c 'import sys,json;print(json.load(sys.stdin)["session_token"])')

          # Fresh partner should be on the starter plan with the starter quota.
          B0=$(curl -s "$BASE/billing" -H "Authorization: Bearer $TOKEN")
          echo "$B0" | python -c 'import sys,json;d=json.load(sys.stdin);assert d["plan"]=="starter",d["plan"];assert d["usage"]["monthly_quota"]==1000;assert d["usage"]["topup_credits"]==0;print("starter default OK")'

          # Dev-simulate: add 500 top-up credits and switch to the growth plan.
          SIM=$(curl -s -X POST "$BASE/billing/dev/simulate" -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' -d '{"credits":500,"plan":"growth"}')
          echo "$SIM" | python -c 'import sys,json;d=json.load(sys.stdin);assert d["topup_credits"]==500;assert d["plan"]=="growth";print("simulate OK")'

          # Snapshot must now show growth quota (5000) + 500 top-ups, one order.
          B1=$(curl -s "$BASE/billing" -H "Authorization: Bearer $TOKEN")
          echo "$B1" | python -c 'import sys,json;d=json.load(sys.stdin);u=d["usage"];assert u["monthly_quota"]==5000,u;assert u["topup_credits"]==500,u;assert len(d["orders"])==1;assert d["orders"][0]["status"]=="paid";print("billing snapshot OK")'

          # Plans catalogue must be present and priced (placeholder rate).
          PLAN=$(curl -s "$BASE/billing/plans")
          echo "$PLAN" | python -c 'import sys,json;d=json.load(sys.stdin);p={x["id"]:x for x in d["plans"]};assert "starter" in p and "growth" in p and "scale" in p;assert d["credit_price_paise"]>0;print("plans OK")'

          echo "billing smoke passed"

      # --- Phase 1b: Backup/DR smoke. Prove the dump script runs against the
      # live DB and a restore round-trip brings data back intact (the DR
      # guarantee). Postgres aborts non-zero if pg_dump fails on a live DB.
      - name: Backup + restore smoke (DR)
        run: |
          set -eux
          DUMP_DIR=$(mktemp -d)
          # 1) Run the real backup script (scripts/db_backup.sh, POSIX sh) in
          #    a postgres container on the compose network.
          docker run --rm --network halohubx-document-intelligence_default \
            -v "$PWD/scripts:/scripts:ro" -v "$DUMP_DIR:/backups" \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -e BACKUP_DATABASE_URL="postgresql://halohubx:$POSTGRES_PASSWORD@db:5432/halohubx" \
            -e BACKUP_DIR=/backups -e BACKUP_KEEP=5 \
            postgres:16-alpine sh /scripts/db_backup.sh
          DUMP=$(ls -1 "$DUMP_DIR"/*.sql.gz)
          test -n "$DUMP"
          echo "dumped: $(basename "$DUMP") ($(du -h "$DUMP" | cut -f1))"
          # 2) Restore into a scratch DB on the same server, then verify data.
          docker compose exec -T db psql -U halohubx -d postgres -c "DROP DATABASE IF EXISTS hhx_dr_test"
          docker compose exec -T db psql -U halohubx -d postgres -c "CREATE DATABASE hhx_dr_test OWNER halohubx"
          docker run --rm --network halohubx-document-intelligence_default \
            -v "$DUMP_DIR:/backups:ro" \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:16-alpine sh -c \
            'gzip -dc /backups/*.sql.gz | psql -h db -p 5432 -U halohubx -d hhx_dr_test -v ON_ERROR_STOP=1 -q'
          N=$(docker compose exec -T db psql -U halohubx -d hhx_dr_test -tAc "SELECT count(*) FROM partners")
          echo "restored partners in scratch DB: $N"
          test "$N" -gt 0
          docker compose exec -T db psql -U halohubx -d postgres -c "DROP DATABASE hhx_dr_test"
          rm -rf "$DUMP_DIR"

      - name: Boot office-ai (Streamlit) and hit its health page
        run: |
          docker compose up -d office-ai
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health >/dev/null; then echo "office-ai up"; break; fi
            sleep 3
          done
          curl -sf http://localhost:8501/_stcore/health

      - name: Tear down
        if: always()
        run: docker compose down -v