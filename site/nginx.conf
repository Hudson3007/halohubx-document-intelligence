# Marketing / landing site reverse proxy. TLS is terminated upstream.
# Redirects HTTP->HTTPS only when a TLS-terminating proxy reports plain HTTP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # --- HTTPS redirect (see frontend/nginx.conf for why we key off the proxy) ---
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
